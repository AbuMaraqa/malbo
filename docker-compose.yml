# Local services for core-view. The port is offset so it never collides with a
# PostgreSQL already installed on the machine.
services:
  postgres:
    image: postgres:18-alpine
    container_name: core-view-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: core_view
      POSTGRES_PASSWORD: core_view
      POSTGRES_DB: core_view
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=16MB
      - -c
      - random_page_cost=1.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core_view -d core_view"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
